<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Yash HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0..100,100..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* DIRECTION C: DOT MATRIX
   Consumer hardware, not a movie prop. Black OLED, soft rounded modules, numbered like
   synth panels, one red accent, and every number drawn in dots. One light module (the brief)
   reads like a printed label stuck on the device.
   Signature: a glyph ring of 60 dots that drains toward whatever is next, and the whole day
   as a single line of 64 quarter hour dots. */
:root{
  color-scheme:dark;
  --bg:#000;--mod:#0e0e0f;--mod2:#161618;--line:#1f1f22;
  --ink:#f2f2f0;--ink2:#bdbdb8;--mute:#77776f;--dim:#3a3a37;--off:#202022;
  --red:#ff3b30;--card:#e9e7e1;--cardInk:#111110;--cardMute:#6d6b64;
  --f:"Geist",system-ui,sans-serif;--fm:"Geist Mono",ui-monospace,monospace;--fd:"Doto",ui-monospace,monospace;--rond:"ROND" 100;
  --gap:clamp(6px,.55vw,12px);--pad:clamp(12px,1.05vw,20px);--r:clamp(14px,1.1vw,22px);
}
html[data-night]{
  --mod:#060100;--mod2:#0b0201;--line:#1a0402;
  --ink:#ff4a35;--ink2:#cf3720;--mute:#86240f;--dim:#3e0f07;--off:#1a0503;
  --red:#ff4a35;--card:#0b0201;--cardInk:#ff4a35;--cardMute:#86240f;
}
*{box-sizing:border-box;min-width:0}
html{font-size:clamp(12.5px,.42vw + 8px,22px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.4 var(--f);-webkit-font-smoothing:antialiased}
body .time,body .rc .cd,body .card .meta b,body .nums b,body .dotf{font-variation-settings:'ROND' 100}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);padding:var(--gap);padding-bottom:calc(var(--gap) + 2.4rem);transform:translate(var(--sx,0),var(--sy,0));transition:transform 2s}
.mod{background:var(--mod);border-radius:var(--r);padding:var(--pad);display:flex;flex-direction:column;overflow:hidden;position:relative}
.lb{display:flex;align-items:center;gap:.6rem;font:500 .72rem/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:.9rem}
.lb .ix{color:var(--dim)}
.lb .rt{margin-left:auto;text-transform:none;letter-spacing:0;white-space:nowrap}
.dotf{font-family:var(--fd);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.empty{color:var(--mute);font-size:.95rem;list-style:none}
.empty.bad{color:var(--red)}
.ld{display:inline-flex;gap:.3rem}.ld i{width:.4rem;height:.4rem;border-radius:50%;background:var(--dim)}
@media(prefers-reduced-motion:no-preference){.ld i{animation:ld 1.2s infinite}.ld i:nth-child(2){animation-delay:.2s}.ld i:nth-child(3){animation-delay:.4s}@keyframes ld{30%{background:var(--ink2)}}}
.fade{-webkit-mask-image:linear-gradient(#000 calc(100% - 1.8rem),transparent);mask-image:linear-gradient(#000 calc(100% - 1.8rem),transparent)}

/* 01 clock */
.clock{grid-column:span 4}
.time{font:900 clamp(5rem,7.4vw,10.5rem)/.82 var(--fd);letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:.2rem 0 0;display:flex;align-items:flex-end;gap:.6rem}
.time small{font:500 1rem/1 var(--fm);color:var(--mute);padding-bottom:.6rem;display:flex;flex-direction:column;gap:.35rem}
.time small b{font-weight:500;color:var(--red)}
.date{font:500 1.35rem/1.15 var(--f);letter-spacing:-.01em;margin-top:1rem}
.date span{color:var(--mute)}
.note{display:none;align-items:center;gap:.6rem;margin-top:1rem;padding:.6rem .85rem;border-radius:999px;background:var(--mod2);font:500 .88rem/1.2 var(--f)}
.note b{width:.55rem;height:.55rem;border-radius:50%;background:var(--red);flex:none}
.note[data-lvl=info] b{background:var(--ink2)}
.note span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note[data-lvl]{display:flex}
.foot1{margin-top:auto;padding-top:1rem;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.lights{display:grid;grid-template-columns:repeat(4,auto);gap:.35rem 1rem}
.lt{display:flex;flex-direction:column;gap:.35rem;font:500 .66rem/1 var(--fm);letter-spacing:.08em;color:var(--mute)}
.lt>span:first-child{display:flex;align-items:center;gap:.4rem}
.lt b{font:500 .66rem var(--fm);color:var(--ink2);font-weight:500}
.led{width:.55rem;height:.55rem;border-radius:50%;background:var(--off);box-shadow:inset 0 0 0 1px var(--dim)}
.led.on{background:var(--ink);box-shadow:none}.led.err,.led.warn{background:var(--red);box-shadow:none}.led.busy{background:var(--ink2);box-shadow:none}
@media(prefers-reduced-motion:no-preference){.led.busy{animation:ld 1s infinite}}
.keys{display:flex;gap:.4rem}
.key{display:flex;flex-direction:column;align-items:center;gap:.35rem;background:none;border:0;padding:0;cursor:pointer}
.key i{width:2.75rem;height:2.75rem;border-radius:.7rem;background:var(--mod2);box-shadow:inset 0 -2px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);display:grid;place-content:center;font:500 .8rem var(--fm);font-style:normal;color:var(--ink2);transition:transform .08s}
.key:active i{transform:translateY(1px)}
.key:focus-visible i{outline:2px solid var(--red);outline-offset:2px}
.key span{font:500 .6rem/1 var(--fm);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.key.r i{background:var(--red);color:#000}
html[data-scan] .key.r i{background:var(--ink)}

/* 02 glyph ring: signature */
.ring{grid-column:span 4;align-items:stretch}
.rw{flex:1;display:grid;place-items:center;position:relative;min-height:0}
.rw svg{width:100%;height:100%;max-height:24rem;display:block}
.rc{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;pointer-events:none}
.rc .k{font:500 .72rem/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
html[data-live] .rc .k{color:var(--red)}
.rc .cd{font:900 clamp(2.6rem,3.6vw,5.2rem)/1 var(--fd);font-variant-numeric:tabular-nums;margin:.35rem 0 .15rem}
.rc .cd small{font:500 .9rem var(--fm);color:var(--mute);margin-left:.15rem}
.rc .w{font:600 1.05rem/1.2 var(--f);max-width:13rem;text-wrap:balance}
.rc .wh{font:400 .8rem/1.3 var(--fm);color:var(--mute);margin-top:.25rem;max-width:13rem}
html[data-soon] .rc .cd{color:var(--red)}

/* 03 brief card */
.card{grid-column:span 4;background:var(--card);color:var(--cardInk)}
.card .lb{color:var(--cardMute)}.card .lb .ix{color:var(--cardMute);opacity:.6}
html[data-briefing] .card .lb .rt::before{content:"updating · "}
.card h1{margin:0;font:600 clamp(1.45rem,1.75vw,2.4rem)/1.12 var(--f);letter-spacing:-.025em;text-wrap:balance}
.then{list-style:none;margin:1.1rem 0 0;padding:0;overflow:hidden}
.then li{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:.6rem;padding:.4rem 0;border-top:1px solid color-mix(in srgb,var(--cardInk) 12%,transparent);font:500 .95rem/1.2 var(--f)}
.then li span:first-child{font:500 .78rem/1.5 var(--fm);color:var(--cardMute);white-space:nowrap}
.then li span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{margin-top:auto;padding-top:1rem;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;border-top:1px solid color-mix(in srgb,var(--cardInk) 15%,transparent)}
.card .meta div{font:500 .66rem/1.2 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--cardMute);padding-top:.7rem}
.card .meta b{display:block;font:800 1.9rem/1 var(--fd);letter-spacing:0;color:var(--cardInk);margin-top:.4rem}
.card .bar{display:flex;gap:3px;margin-top:.9rem}.card .bar i{flex:1;height:.5rem;border-radius:2px;background:color-mix(in srgb,var(--cardInk) 12%,transparent)}.card .bar i.on{background:var(--cardInk)}.card .bar i.cur{background:var(--red)}
.card .barl{display:flex;justify-content:space-between;font:500 .62rem var(--fm);color:var(--cardMute);margin-top:.35rem}

/* 04 today line: signature */
.today{grid-column:span 8}
.dl{position:relative;padding-top:1.3rem}
.dl .hr{position:absolute;top:0;font:500 .66rem/1 var(--fm);color:var(--mute);transform:translateX(-50%)}
.dl .row{display:grid;grid-template-columns:repeat(64,minmax(0,1fr));gap:clamp(2px,.22vw,4px)}
.dl .row i{aspect-ratio:1;border-radius:50%;background:var(--off)}
.dl .row i.b{background:var(--ink)}
.dl .row i.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dim)}
.dl .row i.p{opacity:.3}
.dl .row i.n{background:var(--red);opacity:1}
@media(prefers-reduced-motion:no-preference){.dl .row i.n{animation:pn 2s ease-in-out infinite}@keyframes pn{50%{opacity:.45}}}
.dl .evs{position:relative;height:2.6rem;margin-top:.55rem}
.dl .evs span{position:absolute;top:0;padding-left:.45rem;border-left:1px solid var(--dim);font:500 .86rem/1.15 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .evs span small{display:block;font:400 .7rem/1.3 var(--fm);color:var(--mute)}
.dl .evs span.past{opacity:.4}
.dl .evs span.lo{top:1.3rem}
.dlk{display:flex;gap:1.1rem;flex-wrap:wrap;margin-top:auto;padding-top:.6rem;font:500 .66rem/1 var(--fm);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.dlk i{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.4rem;vertical-align:-1px;background:var(--off)}
.dlk i.b{background:var(--ink)}.dlk i.o{background:none;box-shadow:inset 0 0 0 1.5px var(--dim)}.dlk i.n{background:var(--red)}
.dlk span.r{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--ink2)}

/* 05 numbers */
.nums{grid-column:span 4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:0;background:var(--line)}
.nums div{background:var(--mod);padding:.8rem var(--pad);display:flex;flex-direction:column;justify-content:space-between;gap:.3rem}
.nums span{font:500 .64rem/1.15 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.nums b{font:900 clamp(2rem,2.4vw,3.4rem)/1 var(--fd);font-variant-numeric:tabular-nums}
.nums b small{font:500 .8rem var(--fm);color:var(--mute);margin-left:.15rem}
.nums em{font:400 .7rem/1.2 var(--fm);font-style:normal;color:var(--mute)}
.nums .hot b{color:var(--red)}

/* lower */
.week{grid-column:span 3}
.wg{display:grid;grid-template-columns:2.3rem repeat(18,minmax(0,1fr)) 2.4rem;gap:clamp(2px,.2vw,4px);align-items:center;flex:1;align-content:space-between}
.wg .d{font:500 .68rem/1 var(--fm);color:var(--mute)}
.wg .d.t{color:var(--red)}
.wg i{aspect-ratio:1;border-radius:50%;background:var(--off)}
.wg .h{font:500 .66rem/1 var(--fm);color:var(--ink2);text-align:right}
.wg .hl{font:400 .58rem/1 var(--fm);color:var(--dim);text-align:center}
.tasks{grid-column:span 3}
.tl{list-style:none;margin:0;padding:0;flex:1;overflow:hidden}
.tk{padding:.55rem 0;border-top:1px solid var(--line)}
.tk:first-child{border-top:0;padding-top:0}
.tk label{display:grid;grid-template-columns:2.3rem minmax(0,1fr);gap:.75rem;cursor:pointer;align-items:start}
.box{appearance:none;width:2.1rem;height:2.1rem;margin:0;border-radius:.6rem;background:var(--mod2);box-shadow:inset 0 -2px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);display:grid;place-content:center;cursor:pointer}
.box::after{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--dim)}
.box:checked::after{background:var(--red)}
.box:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tk .tx{font:500 1rem/1.25 var(--f)}
.tk .why{font:400 .74rem/1.3 var(--fm);color:var(--mute);margin-top:.15rem}
.tk .ar{color:var(--ink2);margin-right:.4rem;text-transform:uppercase}
.tk .due{color:var(--red)}
.tk.done .tx{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--red)}
.mail{grid-column:span 3}
.ml{list-style:none;margin:0;padding:0;flex:1;overflow:hidden}
.ml li{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--line);align-items:start}
.ml li:first-child{border-top:0;padding-top:0}
.av{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--mod2);display:grid;place-content:center;font:500 .72rem var(--fm);color:var(--ink2)}
.ml .f{font:600 .95rem/1.2 var(--f);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml .s{font:400 .86rem/1.3 var(--f);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.1rem}
.ml .a{font:400 .7rem var(--fm);color:var(--mute)}
.side{grid-column:span 3;gap:.9rem}
.dc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem;align-items:end}
.dc div{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;min-height:2.6rem}
.dc div i{width:.55rem;height:.55rem;border-radius:50%;background:var(--ink)}
.dc div i.z{background:var(--off)}
.dc div.t i{background:var(--red)}
.dc span{font:500 .58rem/1 var(--fm);color:var(--mute);text-align:center}
.ops{list-style:none;margin:0;padding:0;overflow:hidden}
.ops li{font:400 .82rem/1.3 var(--f);color:var(--ink2);padding:.4rem 0;border-top:1px solid var(--line)}
.ops li b{display:flex;justify-content:space-between;font:500 .7rem/1 var(--fm);letter-spacing:.04em;color:var(--ink);text-transform:uppercase;margin-bottom:.2rem}
.ops li b em{font-style:normal;color:var(--mute)}
.ag{list-style:none;margin:0;padding:0;overflow:hidden}
.ag li{display:grid;grid-template-columns:.7rem minmax(0,1fr);gap:.5rem;padding:.35rem 0;font-size:.86rem;align-items:baseline}
.ag li i{width:.5rem;height:.5rem;border-radius:50%;background:var(--ink2)}
.ag li.blocked i{background:var(--red)}.ag li.done i{background:var(--dim)}
.ag li small{display:block;font:400 .7rem var(--fm);color:var(--mute)}
.side .ops li:nth-child(n+3){display:none}
.sep{border-top:1px solid var(--line);padding-top:.8rem;margin-top:auto;flex:1;min-height:0;display:flex;flex-direction:column}
.sep .lb{margin-bottom:.5rem}

.bar0{position:fixed;left:0;right:0;bottom:0;height:2.4rem;display:flex;align-items:center;gap:.9rem;padding:0 calc(var(--gap) + .6rem);background:var(--bg);z-index:5;font:500 .72rem/1 var(--fm);color:var(--mute)}
.bar0 .dt{width:.45rem;height:.45rem;border-radius:50%;background:var(--red)}
#railN{color:var(--dim)}
#rail{flex:1;font:400 .95rem/1 var(--f);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-reduced-motion:no-preference){#rail.in{animation:ri .6s ease-out}@keyframes ri{from{opacity:0;filter:blur(3px)}}}
.bar0 .pv{display:none;border:1px solid var(--dim);border-radius:999px;padding:.25rem .55rem}
html[data-preview] .bar0 .pv{display:inline}

.boot{position:fixed;inset:0;background:#000;z-index:20;display:grid;place-content:center;transition:opacity .5s}
.boot.gone{opacity:0;pointer-events:none}
.boot div{display:grid;grid-template-columns:repeat(5,.7rem);gap:.35rem}.boot i{width:.7rem;height:.7rem;border-radius:50%;background:var(--off)}
@media(prefers-reduced-motion:no-preference){.boot i{animation:bo .8s forwards}@keyframes bo{to{background:var(--ink)}}}

@media(min-width:1000px) and (min-height:680px){
  body{height:100dvh;overflow:hidden}
  .app{height:100dvh;grid-template-rows:minmax(0,1.35fr) auto minmax(0,1fr)}
}
@media(max-width:1280px){
  .clock{grid-column:span 5}.ring{grid-column:span 7}.card{grid-column:span 5}.today{grid-column:span 7}
  .nums{grid-column:span 12;grid-template-columns:repeat(6,minmax(0,1fr))}
  .week{display:none}.tasks{grid-column:span 5}.mail{grid-column:span 4}.side{grid-column:span 3}
  .side .sep{display:none}
  .dl .evs span{font-size:.76rem}
}
@media(max-width:1280px) and (min-width:1000px) and (min-height:680px){
  .app{grid-template-rows:minmax(0,1.15fr) auto auto minmax(0,1fr)}
  .card{grid-row:2;grid-column:1/span 5}.today{grid-row:2;grid-column:6/span 7}
  .card .meta b{font-size:1.5rem}.then{display:none}
  .time{font-size:clamp(4.5rem,7vw,8rem)}
}
@media(max-width:999px){
  .clock,.ring,.card,.today,.nums,.week,.tasks,.mail,.side{grid-column:1/-1;display:flex}
  .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .rw{min-height:18rem}.rw svg{max-height:18rem}.then{display:none}
  .dl .row{grid-template-columns:repeat(32,minmax(0,1fr))}
  .dl .evs{height:auto;display:flex;flex-direction:column;gap:.4rem}.dl .evs span{position:static;transform:none}
  .fade{-webkit-mask-image:none;mask-image:none}
  .side .sep{display:flex}
}
</style>
</head>
<body>
<div class="boot" id="boot" aria-hidden="true"><div><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.4s"></i></div></div>

<main class="app">
  <section class="mod clock" aria-label="Clock">
    <div class="lb"><span class="ix">01</span>Time<span class="rt" id="stamp">--</span></div>
    <div class="time"><span id="hm">--:--</span><small><span id="ss">--</span><b id="ap"></b></small></div>
    <div class="date" id="date"></div>
    <div class="note" id="note" role="status"><b></b><span id="noteT"></span></div>
    <div class="foot1">
      <div class="lights" aria-label="Feeds">
        <div class="lt"><span><span class="led" id="lCal"></span>CAL</span><b id="bCal">--</b></div>
        <div class="lt"><span><span class="led" id="lMail"></span>MAIL</span><b id="bMail">--</b></div>
        <div class="lt"><span><span class="led" id="lOps"></span>OPS</span><b id="bOps">--</b></div>
        <div class="lt"><span><span class="led" id="lAi"></span>AI</span><b id="bAi">--</b></div>
      </div>
      <div class="keys">
        <button class="key r" data-cmd="rescan" type="button"><i>R</i><span>Scan</span></button>
        <button class="key" data-cmd="night" type="button"><i>N</i><span id="nightBtn">Night</span></button>
        <button class="key" data-cmd="full" type="button"><i>F</i><span>Full</span></button>
      </div>
    </div>
  </section>

  <section class="mod ring" aria-label="Countdown">
    <div class="lb"><span class="ix">02</span>Next<span class="rt" id="calStamp">--</span></div>
    <div class="rw"><svg id="glyph" viewBox="0 0 300 300" aria-hidden="true"></svg>
      <div class="rc"><span class="k" id="nlbl">Linking</span><span class="cd" id="cd"><span class="ld"><i></i><i></i><i></i></span></span><span class="w" id="nwhat"></span><span class="wh" id="nwhen"></span></div>
    </div>
  </section>

  <section class="mod card" aria-label="Brief">
    <div class="lb"><span class="ix">03</span>Brief<span class="rt" id="aiStamp"></span></div>
    <h1 id="headline"><span class="ld"><i></i><i></i><i></i></span></h1>
    <div class="bar" id="dprog" aria-hidden="true"></div>
    <div class="barl"><span>7 AM</span><span id="dpct"></span><span>11 PM</span></div>
    <ul class="then" id="then"></ul>
    <div class="meta" id="cardMeta"></div>
  </section>

  <section class="mod today" aria-label="Today">
    <div class="lb"><span class="ix">04</span>Today, quarter hours<span class="rt">7 AM to 11 PM</span></div>
    <div class="dl" id="dial"></div>
    <div class="dlk"><span><i class="b"></i>Booked</span><span><i class="o"></i>Open block</span><span><i></i>Free</span><span><i class="n"></i>Now</span><span class="r" id="openT"></span></div>
  </section>

  <section class="mod nums" id="gs" aria-label="Numbers"></section>

  <section class="mod week" aria-label="Week">
    <div class="lb"><span class="ix">06</span>Week<span class="rt">6A to 12A</span></div>
    <div class="wg" id="heat"></div>
  </section>

  <section class="mod tasks" aria-label="Tasks">
    <div class="lb"><span class="ix">07</span>Tasks<span class="rt" id="tcount"></span></div>
    <ul class="tl fade" id="actions"><li class="empty"><span class="ld"><i></i><i></i><i></i></span></li></ul>
  </section>

  <section class="mod mail" aria-label="Mail">

let nightForced = null;
function nightCheck() {
  const m = laMin(Date.now()), auto = m >= 1380 || m < 360;
  const on = nightForced == null ? auto : nightForced;
  document.documentElement.toggleAttribute('data-night', on);
  T('nightBtn', on ? 'Day' : 'Night');
}
function toggleNight() { const on = document.documentElement.hasAttribute('data-night'); nightForced = !on; nightCheck(); }
/* tiny drift every 3 minutes so static rules never burn into the OLED */

      ops: [{project: 'SolidHauzWeb', update: 'Shipped the process page, designer is production ready'}, {project: 'ocs_backend', update: 'Broker retries landed'}, {project: 'vr-game', update: 'Hand tracking prototype started'}],

async function start() {
  nightCheck(); tick(); renderDial(); renderGauges(); renderHeat();
  setInterval(tick, 1000); setInterval(minuteTick, 5000); setInterval(pixelShift, 180e3);
  const use = (n) => (window.claude && claude.use) ? claude.use(n).catch(() => null) : Promise.resolve(null);
  [mcp, db, sample] = await Promise.all([use('mcp'), use('db'), use('sample')]);
  if (db) {
    try { const pr = await db.doc('profile/main').get(); if (pr.exists) profileText = String(pr.data().text || ''); } catch {}
    try { const d = await db.doc('brief/latest').get(); if (d.exists) { brief = d.data(); led('Ai', 'on', 'OK'); paintBrief(); } } catch {}
    db.collection('done').onSnapshot((s) => { doneIds = new Set(s.docs.map((d) => d.id)); paintBrief(); }, () => {});
    db.collection('agents').onSnapshot((s) => renderAgents(sortAgents(s.docs.map((d) => ({id: d.id, ...d.data()})))), () => renderAgents([], 'Agent board offline.'));
  } else renderAgents([], 'Open in Claude to see agents.');
  if (!mcp) { mockFeeds(); if (hasShop()) mockShop(); if (typeof extraMock === 'function') extraMock(); T('stamp', 'Preview data'); document.documentElement.dataset.preview = '1'; return; }
  mcp.watchTool(...CAL, onCal, {refetchInterval: FIVE});
  mcp.watchTool(...MAIL, onMail, {refetchInterval: FIVE});
  mcp.watchTool(...CODE, onCode, {refetchInterval: FIVE});
  if (hasShop()) { mcp.watchTool(...SHOP_OV, onShop('ov'), {refetchInterval: 3 * FIVE}); mcp.watchTool(...SHOP_TD, onShop('td'), {refetchInterval: FIVE}); }
  if (typeof extraFeeds === 'function') extraFeeds(mcp);
}
function rescan() {
  if (!mcp) { document.documentElement.dataset.scan = '1'; setTimeout(() => delete document.documentElement.dataset.scan, 900); return; }
  led('Cal', 'busy'); led('Mail', 'busy'); led('Ops', 'busy');
  const feeds = [[...CAL, onCal], [...MAIL, onMail], [...CODE, onCode]];
  if (hasShop()) { led('Shop', 'busy'); feeds.push([...SHOP_OV, onShop('ov')], [...SHOP_TD, onShop('td')]); }
  if (typeof extraRescan === 'function') extraRescan(mcp);
  for (const [srv, tool, input, fn] of feeds) mcp.callTool(srv, tool, input, {cache: {staleTime: 0, gcTime: FIVE, refresh: true}}).then((result) => fn({type: 'data', result})).catch((error) => fn({type: 'error', error}));
  setTimeout(() => maybeBrief(true), 5000);
}
let lock = null;
async function wake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch {} }
async function fullscreen() {
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); } catch {}
  wake(); wantLock = true;
}
let wantLock = false;
document.addEventListener('visibilitychange', () => { if (wantLock && document.visibilityState === 'visible') wake(); });
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-cmd]'); if (!b) return;
  ({rescan, full: fullscreen, night: toggleNight})[b.dataset.cmd]?.();
});
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase(); if (k === 'r') rescan(); else if (k === 'f') fullscreen(); else if (k === 'n') toggleNight();
});
const netState = () => { document.documentElement.toggleAttribute('data-offline', !navigator.onLine); refreshAlerts(); };
addEventListener('online', netState); addEventListener('offline', netState); netState();
setTimeout(() => $('boot')?.classList.add('gone'), reduced ? 0 : 900);


/* ================= VIEW: DOT MATRIX ================= */
const D0 = 420, D1 = 1380;
function renderClock(c) {
  T('hm', c.h + ':' + c.m); T('ss', c.s); T('ap', c.ap);
  $('date').innerHTML = esc(c.wd) + ' <span>' + esc(c.md) + '</span>';
  const p = dayProgress(), lit = Math.floor(p * 24);
  if ($('dprog').childElementCount !== 24) $('dprog').innerHTML = '<i></i>'.repeat(24);
  [...$('dprog').children].forEach((n, i) => n.className = i < lit ? 'on' : i === lit && p < 1 ? 'cur' : '');
  T('dpct', Math.round(p * 100) + '% of the day');
}
/* glyph ring */
function glyph(frac, head) {
  const n = 60, lit = Math.round(frac * n); let s = '';
  for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI - Math.PI / 2, x = 150 + 132 * Math.cos(a), y = 150 + 132 * Math.sin(a), on = i < lit, h = head && i === lit - 1;
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (h ? 6.2 : 5.2) + '" fill="' + (h ? 'var(--red)' : on ? 'var(--ink)' : 'var(--off)') + '"/>'; }
  const hr = laMin(Date.now()) / 60;
  for (let i = 0; i < 24; i++) { const a = i / 24 * 2 * Math.PI - Math.PI / 2, x = 150 + 112 * Math.cos(a), y = 150 + 112 * Math.sin(a);
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (i % 6 === 0 ? 2.2 : 1.5) + '" fill="' + (i === Math.floor(hr) ? 'var(--red)' : 'var(--dim)') + '"/>'; }
  $('glyph').innerHTML = s;
}
function renderNext({now, cur, nxt}) {
  const r = document.documentElement, sm = (ms) => { const t = hms(ms), i = t.lastIndexOf(':'); return esc(t.slice(0, i)) + '<small>' + esc(t.slice(i + 1)) + '</small>'; };
  r.toggleAttribute('data-live', !!cur);
  r.toggleAttribute('data-soon', !cur && !!nxt && nxt.s - now < 10 * 60e3);
  if (cur) { T('nlbl', 'Live now'); $('cd').innerHTML = sm(cur.e - now); T('nwhat', cur.title); T('nwhen', 'ends ' + fmtTime(cur.e) + (nxt ? ', then ' + nxt.title : '')); glyph((cur.e - now) / (cur.e - cur.s), true); }
  else if (nxt) { T('nlbl', 'Until next'); $('cd').innerHTML = sm(nxt.s - now); T('nwhat', nxt.title); T('nwhen', (dayKey(nxt.s) === dayKey(now) ? 'today ' : dayName(nxt.s).toLowerCase() + ', ') + fmtTime(nxt.s)); glyph(Math.min(1, (nxt.s - now) / 72e5), true); }
  else { T('nlbl', 'All clear'); T('cd', '00:00'); T('nwhat', 'Nothing scheduled'); T('nwhen', 'open week'); glyph(0); }
}
/* day line */
function renderDial() {
  let h = ''; for (let hr = 7; hr <= 23; hr += 2) h += '<span class="hr" style="left:' + ((hr * 60 - D0) / (D1 - D0) * 100).toFixed(2) + '%">' + (hr % 12 || 12) + (hr < 12 ? 'a' : 'p') + '</span>';
  const now = Date.now(), nm = laMin(now), k = dayKey(now), busy = calOk ? busyIn(k, D0, D1) : [], fw = calOk ? freeWindows() : [];
  let row = '';
  for (let q = 0; q < 64; q++) {
    const a = D0 + q * 15, b = a + 15, isB = busy.some(([x, y]) => x < b && y > a), isO = !isB && fw.some(([x, y]) => x <= a && y >= b);
    const isN = nm >= a && nm < b;
    row += '<i class="' + (isN ? 'n' : isB ? 'b' : isO ? 'o' : '') + (b <= nm && !isN ? ' p' : '') + '"></i>';
  }
  let evs = '', lastEnd = -1, alt = false;
  if (calOk) timedToday().forEach((e) => { const a = Math.max(D0, laMin(e.s)); if (a >= D1) return; alt = a - lastEnd < 120 ? !alt : false; lastEnd = a;
    evs += '<span class="' + (e.e < now ? 'past ' : '') + (alt ? 'lo' : '') + '" style="left:' + ((a - D0) / (D1 - D0) * 100).toFixed(2) + '%;max-width:' + (100 - (a - D0) / (D1 - D0) * 100).toFixed(1) + '%">' + A(e.link, e.title) + '<small>' + esc(fmtShort(e.s) + ' to ' + fmtShort(e.e)) + '</small></span>'; });
  $('dial').innerHTML = h + '<div class="row">' + row + '</div><div class="evs">' + evs + '</div>';
  T('openT', calOk ? (fw.length ? 'Next open ' + minLabel(fw[0][0]) + ' for ' + dur(fw[0][1] - fw[0][0]) : 'No open blocks left') : '');
  if (calOk) $('then').innerHTML = ev.filter((e) => !e.allDay && !e.free && e.s > now).slice(1, 4).map((e) => '<li><span>' + (dayKey(e.s) === k ? 'Today' : dow(e.s).charAt(0) + dow(e.s).slice(1).toLowerCase()) + ' ' + esc(fmtShort(e.s)) + '</span><span>' + A(e.link, e.title) + '</span></li>').join('');
  const tm = calOk ? tomorrowFirst() : null, m = metrics();
  $('cardMeta').innerHTML = '<div>Left today<b>' + (m.left ?? '--') + '</b></div><div>Free<b>' + (m.free == null ? '--' : m.free.toFixed(1)) + '</b></div><div>Tomorrow<b>' + (tm ? esc(fmtShort(tm.s)) : '--') + '</b></div>';
}
function renderGauges() {
  const m = metrics(), v = (x, d) => x == null ? '--' : d ? x.toFixed(d) : String(x), c = calOk ? conflicts().length : null;
  const cell = (l, val, sub, hot) => '<div class="' + (hot ? 'hot' : '') + '"><span>' + l + '</span><b>' + val + '</b><em>' + sub + '</em></div>';
  $('gs').innerHTML = cell('05 Events', v(m.events), m.left == null ? '' : m.left + ' ahead') + cell('Free', v(m.free, 1) + '<small>h</small>', 'until 11 PM') + cell('Tasks', v(m.open), m.total == null ? 'AI queue' : 'of ' + m.total) + cell('Mail', v(m.mail), 'need you', m.mail > 5) + cell('Ships', v(m.ships), '7 days, ' + v(m.streak) + 'd streak') + cell('Clashes', v(c), c ? 'check calendar' : 'none ahead', c > 0);
}
function renderHeat() {
  if (!calOk) { $('heat').innerHTML = ''; return; }
  let h = '<span></span>'; for (let hr = 6; hr < 24; hr++) h += '<span class="hl">' + (hr % 6 === 0 ? (hr % 12 || 12) : '') + '</span>'; h += '<span></span>';
  weekDays().forEach((d) => {
    h += '<span class="d' + (d.d === 0 ? ' t' : '') + '">' + d.l + '</span>';
    for (let hr = 6; hr < 24; hr++) { const cov = busyIn(d.k, hr * 60, hr * 60 + 60).reduce((s, [a, b]) => s + b - a, 0) / 60; h += '<i style="' + (cov ? 'background:var(--ink);opacity:' + (0.25 + cov * .75).toFixed(2) : '') + '"></i>'; }
    h += '<span class="h">' + d.hrs.toFixed(1) + '</span>';
  });
  $('heat').innerHTML = h;
}
function renderMail() {
  if (!got.mail) return;
  const rows = visibleMail(), why = (brief && brief.mail_why) || {};
  T('bMail', String(rows.length)); T('mailStamp', (brief ? 'AI filtered, ' : '') + rows.length + ' for you');
  $('mailList').innerHTML = rows.length ? rows.slice(0, 8).map((r) => '<li><span class="av">' + esc(initials(r.from)) + '</span><div><div class="f">' + esc(r.from) + '</div><div class="s">' + A(r.link, why[r.id] || r.subj) + '</div></div><span class="a">' + (r.date ? ago(r.date) : '') + '</span></li>').join('') : '<li class="empty">Inbox clear. Nothing needs you.</li>';
}
function renderChart() {
  if (!got.code) return;
  const d = shipDays();
  $('chart').innerHTML = d.map((x, i) => '<div class="' + (i === 6 ? 't' : '') + '">' + (x.n ? '<i></i>'.repeat(Math.min(x.n, 6)) : '<i class="z"></i>') + '</div>').join('') + d.map((x) => '<span>' + x.l.charAt(0) + '</span>').join('');
}
function renderOps() {
  const rows = opsRows(); if (!rows) return;
  $('opsList').innerHTML = rows.length ? rows.map((o) => '<li><b>' + esc(o.project) + (o.n ? '<em>' + o.n + '</em>' : '') + '</b>' + esc(o.update) + '</li>').join('') : '<li class="empty">No build activity this week.</li>';
}
function renderBrief() {
  $('headline').textContent = brief.headline || 'No brief yet.';
  T('aiStamp', ago(brief.at) === 'now' ? 'just now' : ago(brief.at) + ' ago');
  const acts = tasksSorted(); T('tcount', openTasks().length + ' of ' + acts.length + ' open');
  $('actions').innerHTML = acts.length ? acts.map((a) => { const id = aid(a), d = doneIds.has(id); return '<li class="tk' + (d ? ' done' : '') + '" data-id="' + esc(id) + '"><label><input class="box" type="checkbox" data-task-box aria-label="Done: ' + esc(a.text) + '"' + (d ? ' checked' : '') + '><div><div class="tx">' + esc(a.text) + '</div><div class="why"><span class="ar">' + esc(a.area || 'task') + '</span>' + esc(a.why || '') + (a.due ? ' <span class="due">due ' + esc(String(a.due).slice(5).replace('-', '/')) + '</span>' : '') + '</div></div></label></li>'; }).join('') : '<li class="empty">Queue empty. Go build.</li>';
  const items = tickerItems(); if (items.length) setRotator(items);
}
function aiMsg(t) { $('headline').textContent = t; if (!brief) $('actions').innerHTML = '<li class="empty">' + esc(t) + '</li>'; }
function renderAgents(rows, msg) {
  if (msg) { $('agentList').innerHTML = '<li class="empty' + (/offline/i.test(msg) ? ' bad' : '') + '" style="display:block">' + esc(msg) + '</li>'; return; }
  $('agentList').innerHTML = rows.length ? rows.slice(0, 4).map((r) => '<li class="' + esc(r.status || 'working') + '"><i></i><span>' + esc(r.name) + '<small>' + esc(r.status || 'working') + (r.note ? ', ' + esc(r.note) : '') + '</small></span></li>').join('') : '<li class="empty" style="display:block">No agents reporting.</li>';
}
function showErr(feed, msg) {
  if (feed === 'cal') { T('nlbl', 'Calendar off'); T('cd', ''); T('nwhat', msg); }
  else if (feed === 'mail') $('mailList').innerHTML = '<li class="empty bad">' + esc(msg) + '</li>';
  else $('opsList').innerHTML = '<li class="empty bad">' + esc(msg) + '</li>';
}
function renderAlerts(list) {
  const top = list.find((a) => a.lvl === 'bad') || list.find((a) => a.lvl === 'warn') || list[0], n = $('note');
  if (top) { n.dataset.lvl = top.lvl; T('noteT', top.t + (list.length > 1 ? '  +' + (list.length - 1) : '')); } else delete n.dataset.lvl;
}

start();
}
