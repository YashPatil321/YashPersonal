name: Desktop apps

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/macos
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build Halo.app, Lyra.app and Wave.app
        run: ./scripts/bundle.sh
      - name: Disk image
        run: |
          mkdir -p dmg && cp -R build/*.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Wave Suite" -srcfolder dmg -ov -format UDZO build/WaveSuite-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: WaveSuite-macOS
          path: desktop/macos/build/WaveSuite-macOS.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests
        run: dotnet test Lyrics.Tests/Lyrics.Tests.csproj -c Release
      - name: Publish Halo
        run: dotnet publish Halo/Halo.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/Halo
      - name: Publish Lyra
        run: dotnet publish Lyra/Lyra.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/Lyra
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Windows
          path: desktop/windows/out/Halo
      - uses: actions/upload-artifact@v4
        with:
          name: Lyra-Windows
          path: desktop/windows/out/Lyra
