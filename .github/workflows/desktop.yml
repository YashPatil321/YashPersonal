name: Desktop apps

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/macos
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build Wave.app
        run: ./scripts/bundle.sh
      - name: Disk image
        run: |
          mkdir -p dmg && cp -R build/Wave.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Wave" -srcfolder dmg -ov -format UDZO build/Wave-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Wave-macOS
          path: desktop/macos/build/Wave-macOS.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests
        run: dotnet test Lyrics.Tests/Lyrics.Tests.csproj -c Release
      - name: Publish Halo
        run: dotnet publish Halo/Halo.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/Halo
      - name: Publish Lyra
        run: dotnet publish Lyra/Lyra.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/Lyra
      - name: Publish Wave
        run: dotnet publish Wave/Wave.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/Wave
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\WaveSuite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WaveSuite-Windows
          path: desktop/windows/out/WaveSuite-Setup.exe
          if-no-files-found: error
