<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0706; --panel: rgba(255,255,255,.05); --line: rgba(255,255,255,.12); --text: #fff1ea; --dim: #b5918a; --faint: #6e5550;
    --ice: #ff6a4d; --ice-dim: rgba(255, 106, 77, .14); --you: rgba(255,106,77,.12); --danger: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(900px 500px at 15% -10%, rgba(255,106,77,.22), transparent 60%) fixed, radial-gradient(800px 500px at 100% 100%, rgba(255,150,80,.14), transparent 60%) fixed, var(--bg);
    color: var(--text); font: 15px/1.6 Inter, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); backdrop-filter: blur(20px) saturate(160%); box-shadow: inset 0 -1px 0 rgba(255,255,255,.06); position: sticky; top: 0; z-index: 2;
  }
  .mark { width: 26px; height: 26px; position: relative; }
  .mark i { position: absolute; inset: 0; border: 1.5px solid var(--ice); border-radius: 50%; opacity: .9; }
  .mark i:nth-child(2) { transform: rotateX(70deg); animation: spin 6s linear infinite; }
  .mark i:nth-child(3) { transform: rotateY(70deg); animation: spin 9s linear infinite reverse; opacity: .6; }
  .mark b { position: absolute; inset: 9px; border-radius: 50%; background: var(--ice); box-shadow: 0 0 12px var(--ice); }
  body.thinking .mark i:nth-child(2) { animation-duration: 1.2s; }
  body.thinking .mark i:nth-child(3) { animation-duration: 1.8s; }
  @keyframes spin { to { rotate: 360deg; } }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .14em; margin: 0; }
  #status { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 7px; }
  #status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #7be0a6; }
  body.thinking #status::before { background: var(--ice); animation: pulse 1s ease-in-out infinite; }
  body.offline #status::before { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .3; } }
  .spacer { flex: 1; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; }
  .toggle input { display: none; }
  .toggle span { width: 30px; height: 17px; border-radius: 9px; background: var(--line); position: relative; transition: .2s; }
  .toggle span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--dim); transition: .2s; }
  .toggle input:checked + span { background: var(--ice-dim); }
  .toggle input:checked + span::after { left: 15px; background: var(--ice); }

  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  #log { max-width: 760px; margin: 0 auto; padding: 28px 22px 12px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; gap: 12px; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg .who { flex: none; width: 22px; height: 22px; border-radius: 50%; margin-top: 2px; display: grid; place-items: center;
    font-size: 10px; font-weight: 600; color: var(--bg); background: var(--ice); }
  .msg .body { white-space: pre-wrap; word-wrap: break-word; min-width: 0; }
  .msg .time { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .msg.you { justify-content: flex-end; }
  .msg.you .who { display: none; }
  .msg.you .col { max-width: 80%; display: flex; flex-direction: column; align-items: flex-end; }
  .msg.you .bubble { background: linear-gradient(180deg, rgba(255,106,77,.2), rgba(255,106,77,.08)); border: 1px solid rgba(255,150,120,.25); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); backdrop-filter: blur(12px); padding: 9px 14px; border-radius: 14px 14px 4px 14px; }
  .msg.you .time { text-align: right; }
  .body code { font: 13px "JetBrains Mono", Consolas, monospace; background: var(--panel); padding: 1px 5px; border-radius: 4px; }
  .typing { display: none; gap: 12px; align-items: center; color: var(--dim); font-size: 13px; }
  body.thinking .typing { display: flex; }
  .dots i { display: inline-block; width: 5px; height: 5px; margin-right: 4px; border-radius: 50%; background: var(--ice); animation: pulse 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }

  .empty { text-align: center; margin: 12vh auto 0; color: var(--dim); }
  .empty h2 { font-weight: 500; font-size: 22px; color: var(--text); margin: 0 0 6px; letter-spacing: -.01em; }

  footer { padding: 10px 22px 22px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  #chips button { background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); backdrop-filter: blur(12px); color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px;
    font: 13px Inter, system-ui, sans-serif; cursor: pointer; transition: .15s; }
  #chips button:hover { color: var(--text); border-color: var(--ice); background: var(--ice-dim); }
  .composer { display: flex; align-items: flex-end; gap: 10px; background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03)); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 10px 30px rgba(0,0,0,.45);
    padding: 10px 10px 10px 16px; transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: rgba(255, 106, 77, .5); box-shadow: 0 0 0 4px rgba(255, 106, 77, .07); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; max-height: 180px; padding: 6px 0; }
  textarea::placeholder { color: var(--faint); }
  #send { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--ice); color: var(--bg); cursor: pointer;
    display: grid; place-items: center; transition: .15s; }
  #send:disabled { background: var(--line); color: var(--faint); cursor: default; }
  .hint { font-size: 11px; color: var(--faint); margin-top: 8px; text-align: center; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 3px solid var(--bg); }
</style>
</head>
<body>
<header>
  <div class="mark"><i></i><i></i><i></i><b></b></div>
  <h1>ATLAS</h1>
  <div id="status">Ready</div>
  <div class="spacer"></div>
  <label class="toggle" title="Also say replies out loud"><input type="checkbox" id="speak"><span></span>Speak replies</label>
</header>
<main id="scroll">
  <div id="log">
    <div class="empty" id="empty"><h2>What do you need?</h2><div>Ask anything, or tell Atlas what to do on your PC.</div></div>
  </div>
  <div class="wrap" style="padding:0 22px 12px"><div class="typing"><span class="dots"><i></i><i></i><i></i></span>Atlas is working</div></div>
</main>
<footer>
  <div class="wrap">
    <div id="chips">
      <button>touchscreen mode</button><button>calibrate the desk</button><button>what's on today</button>
      <button>desk panels</button><button>desk off</button>
    </div>
    <div class="composer">
      <textarea id="box" rows="1" placeholder="Message Atlas" autofocus></textarea>
      <button id="send" disabled aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line · ↑ for your last message</div>
  </div>
</footer>
<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const q = (p) => p + (p.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN);
const $ = (id) => document.getElementById(id);
const box = $("box"), log = $("log"), scroll = $("scroll");
const els = {};
let history = [], hi = -1;
try { $("speak").checked = localStorage.getItem("atlasSpeak") === "1"; } catch (e) {}
$("speak").onchange = () => { try { localStorage.setItem("atlasSpeak", $("speak").checked ? "1" : "0"); } catch (e) {} };

function esc(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }
function fmt(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
function when(t) { return new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
function atBottom() { return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 80; }

function show(m) {
  $("empty")?.remove();
  const stick = atBottom();
  let el = els[m.id];
  if (!el) {
    el = document.createElement("div");
    el.className = "msg " + m.who;
    el.innerHTML = m.who === "you"
      ? `<div class="col"><div class="bubble"><div class="body"></div></div><div class="time"></div></div>`
      : `<div class="who">A</div><div><div class="body"></div><div class="time"></div></div>`;
    log.appendChild(el); els[m.id] = el;
  }
  el.querySelector(".body").innerHTML = fmt(m.text);
  el.querySelector(".time").textContent = when(m.t);
  if (stick || m.who === "you") scroll.scrollTop = scroll.scrollHeight;
}

function setState(s) {
  const busy = s === "thinking" || s === "speaking";
  document.body.classList.toggle("thinking", busy);
  document.body.classList.remove("offline");
  $("status").textContent = ({ thinking: "Thinking", speaking: "Answering", listening: "Listening" })[s] || "Ready";
}

function connect() {
  const es = new EventSource(q("/chat/stream"));
  es.onmessage = (e) => { const d = JSON.parse(e.data); (d.msgs || []).forEach(show); if (d.state) setState(d.state); };
  es.onerror = () => { es.close(); document.body.classList.add("offline"); $("status").textContent = "Reconnecting"; setTimeout(connect, 2000); };
}
connect();

function send(text) {
  text = (text ?? box.value).trim();
  if (!text) return;
  history.push(text); hi = -1;
  box.value = ""; grow();
  setState("thinking");
  fetch(q("/chat/send"), { method: "POST", body: JSON.stringify({ text, speak: $("speak").checked ? "1" : "0" }) })
    .catch(() => show({ id: "err" + Date.now(), who: "atlas", text: "Atlas isn't reachable. Is it running?", t: Date.now() / 1000 }));
}
function grow() { box.style.height = "auto"; box.style.height = Math.min(180, box.scrollHeight) + "px"; $("send").disabled = !box.value.trim(); }
box.addEventListener("input", grow);
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  else if (e.key === "ArrowUp" && !box.value && history.length) { e.preventDefault(); hi = hi < 0 ? history.length - 1 : Math.max(0, hi - 1); box.value = history[hi]; grow(); }
});
$("send").onclick = () => send();
$("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });
addEventListener("focus", () => box.focus());
</script>
</body>
</html>
